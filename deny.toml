[advisories]
version = 2
ignore = [
    # `paste` (unmaintained). Transitively via ratatui 0.29; compile-time proc-macro
    # only, no runtime exposure. Revisit when ratatui drops it.
    "RUSTSEC-2024-0436",
    # `lru` 0.12.5 (unsound `IterMut`). Transitively via ratatui 0.29, which pins
    # this version; not a remotely-exploitable vulnerability. Revisit on ratatui upgrade.
    "RUSTSEC-2026-0002",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
