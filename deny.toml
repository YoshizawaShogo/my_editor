[advisories]
version = 2
ignore = [
    # `paste` (unmaintained). Transitively via ratatui 0.29; compile-time proc-macro
    # only, no runtime exposure. Revisit when ratatui drops it.
    "RUSTSEC-2024-0436",
    # Known-and-accepted, not a vulnerability so cargo-deny does not fail on it
    # (unsound = warning), listed here for the record: `lru` 0.12.5 (RUSTSEC-2026-0002,
    # unsound `IterMut`) comes in transitively via ratatui 0.29, which pins the version.
    # Revisit on a ratatui upgrade. Not added to the ignore list because deny treats it
    # as a non-fatal warning and an unmatched entry would itself warn.
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
