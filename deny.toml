# cargo-deny configuration. Run with `cargo deny check`.

[graph]
# Check the dependency graph as resolved for every platform we might build on,
# not just the host, so platform-specific crates (e.g. winapi) are covered.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true
exclude-dev = false

[advisories]
version = 2
# Flag unmaintained crates anywhere in the tree (workspace or transitive).
unmaintained = "all"
yanked = "deny"
ignore = [
    # `paste` (unmaintained), pulled in transitively by ratatui 0.29. It is a
    # compile-time proc-macro with no runtime exposure. Revisit when ratatui
    # drops it.
    "RUSTSEC-2024-0436",
]

[bans]
# Duplicate versions are a size/build concern, not a correctness one, and the
# tree currently carries a few via transitive deps — keep it a non-blocking
# allowance rather than churn to unify them.
multiple-versions = "allow"
# A wildcard version is an unpinned dependency; forbid it.
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
deny = [
    # No TLS/crypto surface in a TUI editor; keep OpenSSL out of the tree.
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.93
include-dev = true
include-build = true
# Only licenses actually present in the current tree are allowed; a new
# dependency introducing a different license will fail the check so it can be
# reviewed and added deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
]
exceptions = []

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
